# Builds and tests FlightDeck on every push and pull request.
# Tests that need real hardware (GPU statistics, internet, a C compiler) skip themselves on runners without them.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (debug)
        run: swift build
      - name: Test
        run: swift test
      - name: Build (release, universal)
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Render views off-screen (smoke test)
        run: |
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/FlightDeck
          # On a crash, re-run under lldb to print every thread's backtrace at the moment it dies (GitHub's runners
          # don't keep crash reports).
          if ! "$BIN" --render-views /tmp/views; then
            lldb --batch -o "process launch" -k "thread backtrace all" -k "quit 1" -- "$BIN" --render-views /tmp/views2 2>&1 | tail -150
            exit 1
          fi
          ls -l /tmp/views
