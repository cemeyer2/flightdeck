# Publishes a GitHub Release with a built FlightDeck.dmg and FlightDeck.zip whenever a version tag is pushed:
#   git tag v1.2.3 && git push origin v1.2.3
# It can also be run by hand (Actions › Release › Run workflow) for an existing tag.
#
# Signing is optional. Without the secrets below the app is ad-hoc signed: it runs, but Gatekeeper warns on other Macs
# (right-click › Open, or `xattr -dr com.apple.quarantine /Applications/FlightDeck.app`). Add these repository secrets
# to ship a signed, notarized build instead:
#   MACOS_CERT_P12        base64 of a "Developer ID Application" certificate exported as .p12
#   MACOS_CERT_PASSWORD   that .p12's password
#   SIGN_ID               e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   (optional) notarize with an app-specific password
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true
permissions:
  contents: write   # create the release and upload assets
jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Secrets can't be tested in a step's `if`, so their presence is exposed as flags here.
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0   # full history, for the generated release notes
      - name: Test
        run: swift test
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # A throwaway keychain for this job only; the runner is discarded afterwards.
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Store notarization credentials
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: xcrun notarytool store-credentials flightdeck-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build DMG and zip
        env:
          SIGN_ID: ${{ secrets.SIGN_ID }}
        run: |
          export VERSION="${TAG#v}" BUILD_NUMBER="${{ github.run_number }}"
          if [ "$HAS_NOTARY" = "true" ]; then export NOTARY_PROFILE=flightdeck-notary; fi
          ./scripts/release.sh
          # The zip keeps the app's signature and extended attributes (ditto, not zip).
          ditto -c -k --keepParent build/FlightDeck.app build/FlightDeck.zip
          cd build && shasum -a 256 FlightDeck.dmg FlightDeck.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.SIGN_ID != '' }}
        run: |
          NOTE="Requires macOS 14 or later (Apple silicon or Intel). Download FlightDeck.dmg and drag FlightDeck to Applications."
          if [ "$SIGNED" != "true" ]; then
            NOTE="$NOTE

          This build is not signed with a Developer ID, so macOS will warn the first time you open it: right-click FlightDeck in Applications and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/FlightDeck.app\`."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/FlightDeck.dmg build/FlightDeck.zip build/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" build/FlightDeck.dmg build/FlightDeck.zip build/SHA256SUMS.txt \
              --title "FlightDeck ${TAG#v}" --notes "$NOTE" --generate-notes
          fi
